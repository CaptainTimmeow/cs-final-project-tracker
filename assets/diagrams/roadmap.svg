<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Connecting path -->
  <path d="M80 60 L720 60" stroke="#333355" stroke-width="4" stroke-linecap="round"/>
  <!-- Active path segment (will be masked by JS) -->
  <path id="roadmapPath" d="M80 60 L720 60" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="640" stroke-dashoffset="640"/>
  
  <!-- Nodes -->
  <g class="node" data-phase="0">
    <circle cx="80" cy="60" r="18" fill="#1a1a2e" stroke="#7c4dff" stroke-width="3"/>
    <text x="80" y="64" text-anchor="middle" fill="#e0e0ff" font-size="12" font-family="Segoe UI, sans-serif" font-weight="600">1</text>
    <text x="80" y="100" text-anchor="middle" fill="#8888aa" font-size="11" font-family="Segoe UI, sans-serif">Launch</text>
  </g>
  <g class="node" data-phase="1">
    <circle cx="240" cy="60" r="18" fill="#1a1a2e" stroke="#7c4dff" stroke-width="3"/>
    <text x="240" y="64" text-anchor="middle" fill="#e0e0ff" font-size="12" font-family="Segoe UI, sans-serif" font-weight="600">2</text>
    <text x="240" y="100" text-anchor="middle" fill="#8888aa" font-size="11" font-family="Segoe UI, sans-serif">MVP</text>
  </g>
  <g class="node" data-phase="2">
    <circle cx="400" cy="60" r="18" fill="#1a1a2e" stroke="#7c4dff" stroke-width="3"/>
    <text x="400" y="64" text-anchor="middle" fill="#e0e0ff" font-size="12" font-family="Segoe UI, sans-serif" font-weight="600">3</text>
    <text x="400" y="100" text-anchor="middle" fill="#8888aa" font-size="11" font-family="Segoe UI, sans-serif">Sprint</text>
  </g>
  <g class="node" data-phase="3">
    <circle cx="560" cy="60" r="18" fill="#1a1a2e" stroke="#7c4dff" stroke-width="3"/>
    <text x="560" y="64" text-anchor="middle" fill="#e0e0ff" font-size="12" font-family="Segoe UI, sans-serif" font-weight="600">4</text>
    <text x="560" y="100" text-anchor="middle" fill="#8888aa" font-size="11" font-family="Segoe UI, sans-serif">Polish</text>
  </g>
  <g class="node" data-phase="4">
    <circle cx="720" cy="60" r="18" fill="#1a1a2e" stroke="#7c4dff" stroke-width="3"/>
    <text x="720" y="64" text-anchor="middle" fill="#e0e0ff" font-size="12" font-family="Segoe UI, sans-serif" font-weight="600">5</text>
    <text x="720" y="100" text-anchor="middle" fill="#8888aa" font-size="11" font-family="Segoe UI, sans-serif">Present</text>
  </g>
  
  <!-- You are here marker (hidden by default, shown by JS) -->
  <g id="youAreHere" style="display:none">
    <polygon points="0,-8 -6,4 6,4" fill="#00e676" filter="url(#glow)"/>
    <text x="0" y="-14" text-anchor="middle" fill="#00e676" font-size="10" font-family="Segoe UI, sans-serif" font-weight="600">YOU ARE HERE</text>
  </g>
</svg>