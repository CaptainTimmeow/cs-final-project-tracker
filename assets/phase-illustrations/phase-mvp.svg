<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <linearGradient id="block1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c3fd4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="block2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a060e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="block3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Ground -->
  <rect x="40" y="130" width="160" height="8" rx="4" fill="#333355"/>
  <!-- Foundation blocks (pyramid style) -->
  <!-- Bottom row -->
  <rect x="70" y="105" width="45" height="25" rx="4" fill="url(#block1)"/>
  <rect x="125" y="105" width="45" height="25" rx="4" fill="url(#block2)"/>
  <!-- Middle row -->
  <rect x="82" y="75" width="35" height="25" rx="4" fill="url(#block2)"/>
  <rect x="127" y="75" width="35" height="25" rx="4" fill="url(#block1)"/>
  <!-- Top block (flag) -->
  <rect x="107" y="50" width="30" height="22" rx="4" fill="url(#block3)"/>
  <!-- Flag on top -->
  <line x1="122" y1="50" x2="122" y2="30" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
  <path d="M122 32 L140 39 L122 46Z" fill="#ffd700"/>
  <!-- Connecting dashed lines (build plan) -->
  <line x1="60" y1="85" x2="75" y2="85" stroke="#555577" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="165" y1="60" x2="180" y2="60" stroke="#555577" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="185" y="64" fill="#8888aa" font-size="10" font-family="Segoe UI, sans-serif">MVP</text>
  <!-- Small floating blocks (ideas being placed) -->
  <rect x="50" y="45" width="18" height="14" rx="3" fill="#444466" opacity="0.8"/>
  <rect x="175" y="85" width="16" height="12" rx="3" fill="#444466" opacity="0.6"/>
</svg>