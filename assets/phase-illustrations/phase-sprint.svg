<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252542;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Code window -->
  <rect x="50" y="25" width="140" height="110" rx="10" fill="url(#screen)" stroke="#333355" stroke-width="2"/>
  <!-- Window header dots -->
  <circle cx="68" cy="42" r="4" fill="#ff5f56"/>
  <circle cx="82" cy="42" r="4" fill="#ffbd2e"/>
  <circle cx="96" cy="42" r="4" fill="#27c93f"/>
  <!-- Code lines -->
  <rect x="65" y="58" width="70" height="6" rx="3" fill="#7c4dff" opacity="0.8"/>
  <rect x="65" y="72" width="50" height="6" rx="3" fill="#c084fc" opacity="0.6"/>
  <rect x="65" y="86" width="90" height="6" rx="3" fill="#00e676" opacity="0.7"/>
  <rect x="65" y="100" width="40" height="6" rx="3" fill="#ff5f56" opacity="0.5"/>
  <rect x="65" y="114" width="60" height="6" rx="3" fill="#ffd700" opacity="0.6"/>
  <!-- Cursor blinking -->
  <rect x="130" y="114" width="3" height="10" fill="#00e676">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Speed/motion lines -->
  <line x1="200" y1="50" x2="225" y2="50" stroke="#7c4dff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="205" y1="65" x2="230" y2="65" stroke="#c084fc" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="200" y1="80" x2="220" y2="80" stroke="#7c4dff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Lightning bolt (sprint energy) -->
  <path d="M195 95 L185 115 L195 115 L190 135 L210 110 L200 110 L205 95Z" fill="#ffd700" opacity="0.8"/>
  <!-- Bug icon (debugging) -->
  <circle cx="60" cy="125" r="8" fill="#ff5f56" opacity="0.3"/>
  <line x1="55" y1="120" x2="52" y2="115" stroke="#ff5f56" stroke-width="1.5" opacity="0.5"/>
  <line x1="65" y1="120" x2="68" y2="115" stroke="#ff5f56" stroke-width="1.5" opacity="0.5"/>
  <!-- Fixed check -->
  <circle cx="190" cy="125" r="10" fill="#00e676" opacity="0.2"/>
  <path d="M185 125 L188 128 L195 121" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>